# The suite only defended anything when someone remembered to run it. In one
# session it caught three bugs that would otherwise have shipped, so the cost
# of it not running is measured, not hypothetical.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The browser suites are the slow ones; WebKit alone boots four device
    # profiles. Well clear of the real runtime, short enough that a hang fails
    # rather than idling for six hours.
    timeout-minutes: 30

    # Playwright's own image: Chromium and WebKit, and every system package
    # they need, already installed. They used to be installed on each run with
    # `playwright install --with-deps`, which fetches about a hundred packages
    # from Ubuntu's mirrors -- and a slow mirror failed the job before a suite
    # ran: 27 minutes of trickling on 2026-11-18 (run 44258974103), and three
    # five-minute attempts all stalled on 2026-11-19 (run 44506032960) while
    # the same commit passed on two other machines. The image comes from
    # Microsoft's registry, not the mirrors, and installs nothing at run time.
    #
    # The image's version MUST be the one tests/package.json pins Playwright
    # to ("1.62.1"): its browsers are built for that release and no other.
    # Change the two together -- the "Check the browsers" step below fails at
    # once, saying so, if they ever disagree. --user 1001 is how Playwright's
    # own GitHub Actions example runs it (the runner's user, which owns the
    # checked-out workspace).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No cache and `npm install`, not `npm ci`: lockfiles are gitignored here
      # on purpose (.gitignore:15 and :40), so there is nothing for either to
      # resolve -- which is exactly how this workflow failed on its first run,
      # eight seconds in, with "Some specified paths were not resolved".
      # Playwright itself is pinned exactly in tests/package.json, to match the
      # image above; playwright pins its own playwright-core, so nothing on the
      # browser side floats.
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      # chromium AND webkit. Chromium is not Safari, and the iPad
      # ReferenceError that hid the Add to Home Screen prompt was invisible in
      # every Chromium suite in this repository -- WebKit found it on its first
      # run. Both are started once here, so an image that does not match the
      # pinned Playwright fails in seconds with a sentence instead of forty
      # suites each failing on a missing executable.
      - name: Check the browsers
        working-directory: tests
        timeout-minutes: 2
        shell: bash
        run: |
          node <<'JS'
          const pw = require("playwright");
          const version = require("playwright/package.json").version;
          (async () => {
            for (const name of ["chromium", "webkit"]) {
              const browser = await pw[name].launch();
              await browser.close();
            }
            console.log(`Playwright ${version}: chromium and webkit start in this image.`);
          })().catch(err => {
            console.log(`::error::The container image does not carry the browsers for Playwright ${version}. ` +
              "Set the image tag in .github/workflows/tests.yml and the version in tests/package.json to the same release.");
            console.log(String(err && err.message || err).split("\n").slice(0, 6).join("\n"));
            process.exit(1);
          });
          JS

      - name: Run every suite
        working-directory: tests
        run: npm test
