# The suite only defended anything when someone remembered to run it. In one
# session it caught three bugs that would otherwise have shipped, so the cost
# of it not running is measured, not hypothetical.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The browser suites are the slow ones; WebKit alone boots four device
    # profiles. Well clear of the real runtime, short enough that a hang fails
    # rather than idling for six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No cache and `npm install`, not `npm ci`: lockfiles are gitignored here
      # on purpose (.gitignore:15 and :40), so there is nothing for either to
      # resolve -- which is exactly how this workflow failed on its first run,
      # eight seconds in, with "Some specified paths were not resolved".
      # The cost is that playwright floats within ^1.49.0 rather than pinning,
      # so a CI run can use a newer build than a local one. That is the
      # project's existing choice about lockfiles, not this workflow's to make.
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      # chromium AND webkit. Chromium is not Safari, and the iPad
      # ReferenceError that hid the Add to Home Screen prompt was invisible in
      # every Chromium suite in this repository -- WebKit found it on its first
      # run. --with-deps because WebKit on Linux needs five system packages it
      # will not tell you about until it fails to launch.
      #
      # Bounded and retried. It normally takes about 30 seconds, but on
      # 2026-11-18 apt-get trickled the system packages in from a slow Ubuntu
      # mirror for 27 minutes (run 44258974103), leaving three of the job's
      # thirty for the suites: the job was cancelled, the deploy that waits on
      # it skipped, and a passing release sat unpublished. Each attempt now
      # gets five minutes; a stalled one is killed, any half-done package
      # install is finished off, and it tries again, three times at most. The
      # step's own limit keeps the suites their time either way.
      #
      # "Killed" has to include the apt-get that playwright starts through
      # sudo. timeout signals its own process group, and sudo runs the command
      # on a pty in a session of its own, so the apt-get outlived it: on
      # 2026-11-19 (run 44472861838) attempt 1 stalled on the mirror, its
      # apt-get kept the dpkg lock, and attempts 2 and 3 failed within seconds
      # on "Could not get lock" -- three tries that were one. stop_apt stops
      # it and waits for the lock before the next try. The [s] in the methods
      # pattern keeps pkill -f from matching the sudo that runs it.
      - name: Install browsers
        working-directory: tests
        timeout-minutes: 18
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          stop_apt(){
            sudo pkill -TERM -x apt-get || true
            for i in $(seq 1 20); do
              pgrep -x 'apt-get|dpkg' >/dev/null || return 0
              sleep 1
            done
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -f '/usr/lib/apt/method[s]/' || true
            sleep 2
          }
          for attempt in 1 2 3; do
            if timeout -k 30 300 npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            [ "$attempt" = 3 ] && break
            echo "::warning::Installing the test browsers took over 5 minutes or failed (attempt $attempt of 3). Trying again."
            stop_apt
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::Couldn't install the test browsers in three tries. Re-run the job."
          exit 1

      - name: Run every suite
        working-directory: tests
        run: npm test
